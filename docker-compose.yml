version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: happi_reviews_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - '8001:8001'
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001/api
    depends_on:
      - backend

volumes:
  postgres_data:
